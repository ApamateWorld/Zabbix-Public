        - uuid: ac942335465c4edabf8d908a37b8a0f3
          name: 'IBM Storage: Physical capacity utilization'
          type: CALCULATED
          key: ibm.storage.system.physical_utilization
          delay: 5m
          history: 90d
          value_type: FLOAT
          units: '%'
          params: '100*(last(//ibm.storage.system.physical_capacity)-last(//ibm.storage.system.physical_free_capacity))/last(//ibm.storage.system.physical_capacity)'
          description: 'Calculated physical capacity utilization.'
