        - uuid: 6eae7fc3c0bb43448fb99089b1f7e550
          name: 'IBM Storage: Physical capacity'
          type: DEPENDENT
          key: ibm.storage.system.physical_capacity
          history: 30d
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.system.physical_capacity
            - type: JAVASCRIPT
              parameters:
                - |
                  var m = String(value).trim().match(/^([0-9]+(?:\.[0-9]+)?)\s*(B|KB|MB|GB|TB|PB)$/i);
                  if (!m) {
                      throw 'Unsupported IBM capacity format: ' + value;
                  }
                  var factor = {
                      B: 1,
                      KB: 1024,
                      MB: 1024 * 1024,
                      GB: 1024 * 1024 * 1024,
                      TB: 1024 * 1024 * 1024 * 1024,
                      PB: 1024 * 1024 * 1024 * 1024 * 1024
                  };
                  return Math.round(parseFloat(m[1]) * factor[m[2].toUpperCase()]);
          master_item:
            key: ibm.storage.get
          tags:
            - tag: component
              value: system
        - uuid: 45ea5bf7fdb04a7191ddc504bb295044
          name: 'IBM Storage: Physical free capacity'
