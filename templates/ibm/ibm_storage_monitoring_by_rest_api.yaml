  templates:
    - uuid: 76c29a52bee245f495956592d6ecbc10
      template: 'IBM Storage Monitoring by REST API'
      name: 'IBM Storage Monitoring by REST API'
      description: 'Monitors IBM Storage Virtualize systems through the classic REST API (/rest/auth and /rest/*), validated against IBM FlashSystem 5000 running code level 8.4.0.6. Uses one Script master item, dependent items and low-level discovery for nodes, enclosures, drives, pools and Fibre Channel ports.'
      vendor:
        name: Custom
        version: '1.0'
      groups:
        - name: 'Templates/Empresa Corp'
        - name: Templates/Storage
      items:
        - uuid: 6f1bb8c095e746cb83668d9f06dc92dd
          name: 'IBM Storage: Get data'
          type: SCRIPT
          key: ibm.storage.get
          delay: 5m
          history: 1d
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            
            function required(name) {
                if (typeof p[name] === 'undefined' || p[name] === '' ||
                        p[name] === '{$IBM.API.' + name.toUpperCase() + '}') {
                    throw 'Missing required parameter: ' + name;
                }
            }
            
            required('url');
            required('username');
            required('password');
            
            var base = p.url.replace(/\/+$/, '');
            var endpoints = {
                system: '/lssystem',
                nodes: '/lsnode',
                enclosures: '/lsenclosure',
                drives: '/lsdrive',
                pools: '/lsmdiskgrp',
                fc_ports: '/lsportfc'
            };
            
            function parseJson(body, endpoint) {
                try {
                    return JSON.parse(body);
                }
                catch (e) {
                    throw 'Invalid JSON from ' + endpoint + ': ' + body;
                }
            }
            
            function checkStatus(req, body, endpoint) {
                var status = req.getStatus();
                if (status < 200 || status >= 300) {
                    throw 'HTTP ' + status + ' from ' + endpoint + ': ' + body;
                }
            }
            
            function authenticate() {
                var req = new HttpRequest();
                 req.addHeader('Accept: application/json');
                req.addHeader('X-Auth-Username: ' + p.username);
                req.addHeader('X-Auth-Password: ' + p.password);
            
                var body = req.post(base + '/auth', '');
                checkStatus(req, body, '/auth');
            
                var auth = parseJson(body, '/auth');
                if (!auth.token) {
                    throw 'Authentication response does not contain token';
                }
                return auth.token;
            }
            
            function query(endpoint, token) {
                var req = new HttpRequest();
                req.addHeader('Accept: application/json');
                req.addHeader('X-Auth-Token: ' + token);
            
                var body = req.post(base + endpoint, '');
                checkStatus(req, body, endpoint);
                return parseJson(body, endpoint);
            }
            
            var token = authenticate();
            var result = {
                collected_at: Math.floor(Date.now() / 1000)
            };
            
            for (var name in endpoints) {
                result[name] = query(endpoints[name], token);
            }
            
            return JSON.stringify(result);
          description: 'Authenticates against /rest/auth and retrieves all datasets used by this template.'
          timeout: '{$IBM.API.TIMEOUT}'
          parameters:
            - name: password
              value: '{$IBM.API.PASSWORD}'
            - name: url
              value: '{$IBM.API.URL}'
            - name: username
              value: '{$IBM.API.USER}'
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: 9e53c26520024aeeb953d8d0f666af63
              expression: 'nodata(/IBM Storage Monitoring by REST API/ibm.storage.get,15m)=1'
              name: 'IBM Storage: No REST API data for 15 minutes'
              priority: HIGH
              description: 'The master REST API item has not returned data.'
              tags:
                - tag: scope
                  value: availability
        - uuid: c0dade2cf38342d0acb4071aaf9774a7
