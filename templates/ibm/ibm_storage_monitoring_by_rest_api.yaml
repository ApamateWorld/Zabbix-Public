        - uuid: 20cf416a907d43f6babbb82dee9355de
          name: 'IBM Storage: Pool discovery'
          type: DEPENDENT
          key: ibm.storage.pool.discovery
          lifetime: 30d
          item_prototypes:
            - uuid: 0444c1b1db704976b1df0ff6b697c1d5
              name: 'IBM Storage: Pool {#POOL.NAME}: Capacity'
              type: DEPENDENT
              key: 'ibm.storage.pool.capacity[{#POOL.ID}]'
              history: 30d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pools[?(@.id=="{#POOL.ID}")].capacity.first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var m = String(value).trim().match(/^([0-9]+(?:\.[0-9]+)?)\s*(B|KB|MB|GB|TB|PB)$/i);
                      if (!m) {
                          throw 'Unsupported IBM capacity format: ' + value;
                      }
                      var factor = {
                          B: 1,
                          KB: 1024,
                          MB: 1024 * 1024,
                          GB: 1024 * 1024 * 1024,
                          TB: 1024 * 1024 * 1024 * 1024,
                          PB: 1024 * 1024 * 1024 * 1024 * 1024
                      };
                      return Math.round(parseFloat(m[1]) * factor[m[2].toUpperCase()]);
              master_item:
                key: ibm.storage.get
              tags:
                - tag: component
                  value: pool
            - uuid: 808682bcc9c8445cb691ada08e2764e7
